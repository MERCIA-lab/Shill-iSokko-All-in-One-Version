version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: imeek-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: imeek
      POSTGRES_PASSWORD: imeek
      POSTGRES_DB: imeek_commerce
    ports:
      - "5432:5432"
    volumes:
      - imeek_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: imeek-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: imeek-api
    depends_on:
      - postgres
      - redis
    env_file: .env
    ports:
      - "4000:4000"

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: imeek-admin
    depends_on:
      - api
    env_file: .env
    ports:
      - "3001:3001"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: imeek-web
    depends_on:
      - api
    env_file: .env
    ports:
      - "3000:3000"

volumes:
  imeek_pg_data:
